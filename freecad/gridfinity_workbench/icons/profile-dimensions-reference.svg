      <path d="M 49.967 54 L 51.5 52.5 L 51.5 55.5 Z" fill="#a31515"/>
      <path d="M 60 54 L 58.5 52.5 L 58.5 55.5 Z" fill="#a31515"/>
    </svg>
  </g>
  <text x="32" y="12" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#000">1</text>
  
  <!-- 2. Height -->
  <g transform="translate(64, 16)">
    <svg width="64" height="64" viewBox="48 40 16 22">
      <!-- Bin profile (center section, yellow) - shifted left for gap -->
      <path d="M 5.167 38.300 L 5.167 10.300 L 12.167 10.300 L 12.167 31.300 A 7.000 7.000 0 0 0 19.167 38.300 L 44.833 38.300 A 7.000 7.000 0 0 0 51.833 31.300 L 51.833 10.300 L 58.833 10.300 L 58.833 38.300 L 48.800 48.333 L 48.800 56.733 L 45.533 60.000 L 18.467 60.000 L 15.200 56.733 L 15.200 48.333 L 5.167 38.300"
